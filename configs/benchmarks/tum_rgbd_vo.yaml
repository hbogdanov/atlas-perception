input:
  mode: rgbd_dataset
  source: data/samples/tum_freiburg1_xyz

depth:
  source_mode: input
  output_mode: raw
  postprocess:
    enabled: false

slam:
  mode: rgbd_vo
  pose_graph:
    enabled: true
    loop_closure:
      # Disabled until appearance-verified loop constraints and optimization are added.
      enabled: false

semantics:
  enabled: false

ros2:
  enabled: false

output:
  output_dir: data/outputs/benchmarks/tum_rgbd_vo
  save_pointcloud: true
  save_trajectory: true
