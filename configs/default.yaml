input:
  mode: webcam
  source: 0
  width: 640
  height: 480
  fps: 30
  timeout_sec: 5.0

camera:
  fx: 525.0
  fy: 525.0
  cx: 319.5
  cy: 239.5

depth:
  depth_model: midas
  source_mode: estimate
  device: cpu
  input_size: 518
  output_mode: relative_normalized
  weights_dir: models
  midas_variant: MiDaS_small
  depth_anything_encoder: vitl
  prefer_torch_hub: true
  postprocess:
    enabled: true
    bilateral_filter: true
    bilateral_diameter: 7
    bilateral_sigma_color: 0.1
    bilateral_sigma_space: 7.0
    guided_refine: true
    guided_radius: 8
    guided_eps: 0.001
    temporal_fusion: false
    temporal_alpha: 0.7

semantics:
  enabled: false
  backend: yolov8_seg
  model: models/checkpoints/yolov8n-seg.pt
  device: cpu
  confidence: 0.25
  iou: 0.7

evaluation:
  calibration_perturbation:
    enabled: false
    fx_scale: 1.0
    fy_scale: 1.0
    cx_offset_px: 0.0
    cy_offset_px: 0.0
  pose_perturbation:
    enabled: false
    translation_std_m: 0.0
    rotation_std_deg: 0.0
    dropout_probability: 0.0
    latency_frames: 0
    seed: 0

visual_localization:
  enabled: false
  dictionary: DICT_4X4_50
  marker_length_m: 0.16
  max_reprojection_error: 3.0
  landmarks: []
  pose_correction:
    apply_to_mapping: false
    blend_weight: 1.0
    max_timestamp_delta_sec: 0.05
    max_translation_innovation_m: 2.0
    max_rotation_innovation_deg: 45.0
    max_translation_std_m: 0.5
    max_rotation_std_deg: 20.0

slam:
  mode: disabled
  frame_stride: 1
  pose_topic: /rtabmap/localization_pose
  pose_message_type: pose_with_covariance
  timeout_sec: 0.05
  # rgbd_vo is sparse metric visual odometry, not compatible with relative monocular depth.
  max_features: 1200
  match_ratio: 0.75
  min_correspondences: 20
  min_inliers: 12
  max_depth_m: 8.0
  pose_graph:
    enabled: true
    loop_closure:
      # rgbd_vo verifies appearance candidates with RGB-D PnP before graph correction.
      enabled: false
      proximity_enabled: false
      min_node_gap: 15
      distance_threshold: 0.15
      max_candidates: 3
      min_matches: 30
      min_inliers: 15
      max_reprojection_error: 2.5

mapping:
  enabled: true
  representation: pointcloud
  max_points: 150000
  # Persistent global voxel count, retained across the full run (not a rolling frame buffer).
  max_voxels: 60000
  voxel_size: 0.03
  # Deterministic CPU bound that preserves frame coverage without per-pixel map growth.
  max_samples_per_frame: 6000
  stride: 2
  confidence_fusion:
    enabled: false
    edge_scale: 0.15
    min_confidence: 0.2
  multi_view_consistency:
    enabled: false
    relative_error_scale: 0.1
  semantic_color_fusion: true
  tsdf_voxel_length: 0.04
  tsdf_sdf_trunc: 0.08
  tsdf_depth_scale: 1.0
  tsdf_depth_trunc: 4.0
  tsdf_estimate_normals: false
  export_path: data/outputs/frame_cloud.ply

ros2:
  enabled: false
  depth_topic: /atlas/depth
  pose_topic: /atlas/pose
  path_topic: /atlas/path
  pointcloud_topic: /atlas/pointcloud
  visual_pose_topic: /atlas/visual_pose
  # Depth is published in camera_frame_id. Pose, path, cloud, and visual pose use map_frame_id.
  map_frame_id: map
  camera_frame_id: atlas_camera

output:
  save_rgb_snapshot: false
  save_depth_snapshot: false
  save_semantic_snapshot: false
  save_demo_video: false
  save_depth_video: false
  save_trajectory: true
  save_pointcloud: true
  output_dir: data/outputs
  demo_video_path: data/outputs/atlas_demo.mp4
  demo_video_fps: 15
  demo_video_width: 1280
  demo_video_height: 720
  demo_map_projection: auto
  demo_map_bounds: null
  visualize: false
