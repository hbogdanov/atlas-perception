input:
  mode: rgbd_dataset
  source: data/samples/tum_freiburg1_xyz

depth:
  source_mode: input
  output_mode: raw
  postprocess:
    enabled: false

slam:
  mode: groundtruth

ros2:
  enabled: false

output:
  save_rgb_snapshot: true
  save_depth_snapshot: true
  save_demo_video: true
  save_pointcloud: true
  save_trajectory: true
  output_dir: data/outputs/tum_main_eval
  demo_video_path: data/outputs/tum_main_eval/atlas_eval_demo.mp4
