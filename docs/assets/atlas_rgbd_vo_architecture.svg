<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Atlas RGB-D visual odometry and reconstruction architecture</title>
  <desc id="desc">RGB-D input flows through ORB feature tracking, depth-backed PnP visual odometry, pose correction and graph constraints, world-space voxel fusion, and ROS2 outputs.</desc>
  <rect width="1200" height="270" fill="#f5f0e6"/>
  <style>.box{fill:#fffdfa;stroke:#29434e;stroke-width:2}.head{font:700 18px Georgia,serif;fill:#19323c}.copy{font:14px Georgia,serif;fill:#40545c}.arrow{stroke:#d06c3d;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d06c3d"/></marker></defs>
  <rect class="box" x="28" y="93" width="165" height="82" rx="10"/><text class="head" x="52" y="126">RGB-D input</text><text class="copy" x="52" y="151">calibrated frames</text>
  <rect class="box" x="252" y="66" width="190" height="135" rx="10"/><text class="head" x="279" y="102">Owned RGB-D VO</text><text class="copy" x="279" y="129">ORB tracks</text><text class="copy" x="279" y="151">depth-backed PnP</text><text class="copy" x="279" y="173">RANSAC gating</text>
  <rect class="box" x="501" y="66" width="190" height="135" rx="10"/><text class="head" x="524" y="102">Pose correction</text><text class="copy" x="524" y="129">landmark PnP</text><text class="copy" x="524" y="151">appearance loops</text><text class="copy" x="524" y="173">translation graph</text>
  <rect class="box" x="750" y="66" width="190" height="135" rx="10"/><text class="head" x="774" y="102">Global fusion</text><text class="copy" x="774" y="129">world-space voxels</text><text class="copy" x="774" y="151">confidence hooks</text><text class="copy" x="774" y="173">PLY / TSDF export</text>
  <rect class="box" x="999" y="93" width="165" height="82" rx="10"/><text class="head" x="1027" y="126">ROS2 outputs</text><text class="copy" x="1027" y="151">depth, pose, path, cloud</text>
  <path class="arrow" d="M193 134H244"/><path class="arrow" d="M442 134H493"/><path class="arrow" d="M691 134H742"/><path class="arrow" d="M940 134H991"/>
</svg>
